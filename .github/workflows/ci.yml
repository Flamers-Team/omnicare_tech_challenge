name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # Os testes não podem chamar o Azure: variáveis vazias valem mais que qualquer .env.
      AZURE_SPEECH_KEY: ""
      AZURE_LANGUAGE_KEY: ""
      E2E_BROWSER_CHANNEL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Bibliotecas de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 libasound2t64 libgl1

      - name: Dependências (PyTorch só CPU)
        run: |
          pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check app services tests tests_e2e

      - name: Testes da API e dos serviços
        run: python -m pytest -q

      - name: Instalar o Chromium do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Testes de ponta a ponta no navegador
        run: python -m pytest tests_e2e -q -p no:cacheprovider

  imagem:
    # Garante que a imagem Docker continua construindo. Não envia nada para lugar nenhum.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: omnicare:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
