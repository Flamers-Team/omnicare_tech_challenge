name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # Os testes não podem chamar o Azure: variáveis vazias valem mais que qualquer .env.
      AZURE_SPEECH_KEY: ""
      AZURE_LANGUAGE_KEY: ""
      E2E_BROWSER_CHANNEL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Bibliotecas de sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 libasound2t64 libgl1

      - name: Dependências (PyTorch só CPU)
        run: |
          pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check app services tests tests_e2e

      - name: Testes da API e dos serviços
        run: python -m pytest -q

      - name: Instalar o Chromium do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Testes de ponta a ponta no navegador
        run: python -m pytest tests_e2e -q -p no:cacheprovider

  imagem:
    # Garante que a imagem Docker continua construindo. Não envia nada para lugar nenhum.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: omnicare:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bibliotecas pesadas importam dentro da imagem
        run: |
          docker run --rm omnicare:ci python -c "import cv2, mediapipe, librosa, soundfile, torch, ultralytics, azure.cognitiveservices.speech; print('imports ok')"

      - name: Contêiner sobe e responde a API
        run: |
          docker run -d --name omnicare -p 8000:8000 -e AZURE_SPEECH_KEY= -e AZURE_LANGUAGE_KEY= omnicare:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/v1/status > status.json; then break; fi
            sleep 3
          done
          cat status.json
          STAY=$(curl -fsS http://localhost:8000/api/v1/pacientes | python3 -c "import sys,json; print(json.load(sys.stdin)['sugerida'])")
          curl -fsS "http://localhost:8000/api/v1/pacientes/$STAY/linha-do-tempo" > /dev/null
          curl -fsS -X POST "http://localhost:8000/api/v1/pacientes/$STAY/marcha/exemplo/alterada" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['resultado']['alerta'] is True; print('marcha alterada gerou alerta')"
          curl -fsS http://localhost:8000/ | grep -q "OmniCare AI"
          curl -fsS http://localhost:8000/static/js/main.js > /dev/null
          echo "contêiner ok"

      - name: Log do contêiner (se falhar)
        if: failure()
        run: docker logs omnicare || true
