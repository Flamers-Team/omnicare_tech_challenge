<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniCare AI</title>
  <link rel="icon" href="data:," />
  <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.js"></script>
  <style>
    :root {
      color-scheme: light;
      --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #6f6d68;
      --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.12); --line: #2a78d6; --accent: #1c5cab;
      --good: #006300; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --wash: #f0efec;
    }
    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) {
        color-scheme: dark;
        --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #a09e96;
        --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.12); --line: #3987e5; --accent: #86b6ef;
        --good: #0ca30c; --wash: #2c2c2a;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    #app { max-width: 1240px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 22px; margin: 0; }
    h2 { font-size: 16px; margin: 0 0 8px; }
    p { margin: 0 0 8px; }
    header { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .sub { color: var(--ink-2); font-size: 13px; }
    .small { font-size: 13px; }
    .muted { color: var(--muted); }
    nav { display: flex; flex-wrap: wrap; gap: 6px; }
    .row > div { min-width: 0; max-width: 100%; }
    select, input[type=text], input.number { max-width: 100%; }
    input.number { width: 110px; }
    button, select, input[type=text], input.number { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 6px; padding: 7px 12px; }
    button { cursor: pointer; }
    button:hover:not(:disabled) { background: var(--wash); }
    button:disabled { opacity: .55; cursor: default; }
    button.on, button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    @media (prefers-color-scheme: dark) { :root:where(:not([data-theme="light"])) button.on, :root:where(:not([data-theme="light"])) button.primary { color: #0b0b0b; } }
    button.primary:hover:not(:disabled), button.on:hover:not(:disabled) { background: var(--accent); filter: brightness(1.1); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .chip { font-size: 12px; padding: 2px 9px; border-radius: 99px; border: 1px solid var(--border); color: var(--ink-2); background: var(--surface); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 14px; min-width: 0; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; }
    label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 3px; }
    .main-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 860px) { .main-grid, .two { grid-template-columns: 1fr; } }
    .banner { border-left: 6px solid var(--axis); }
    .banner.baixo { border-left-color: var(--good); }
    .banner.atencao { border-left-color: var(--warning); }
    .banner.alto { border-left-color: var(--critical); }
    .level { font-weight: 700; font-size: 17px; }
    ul.plain { list-style: none; margin: 0; padding: 0; }
    ul.plain li { padding: 7px 0; border-top: 1px solid var(--grid); font-size: 13px; }
    ul.plain li:first-child { border-top: 0; }
    .chart-box { margin-bottom: 8px; }
    .chart-head { display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); }
    .chart-head strong { color: var(--ink); font-size: 15px; }
    .chart-wrap { position: relative; height: 88px; }
    .feed { max-height: 560px; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 5px 8px; border-top: 1px solid var(--grid); }
    .table-scroll { overflow-x: auto; }
    .error { color: var(--critical); font-size: 13px; margin-top: 8px; }
    .file { font-size: 13px; max-width: 100%; }
    .tag { font-size: 12px; font-weight: 600; }
    details summary { cursor: pointer; font-size: 13px; color: var(--ink-2); }
    [v-cloak] { display: none; }
  </style>
</head>
<body>
<div id="app" v-cloak>
  <header>
    <div>
      <h1>OmniCare AI</h1>
      <div class="sub">Monitoramento hospitalar multimodal. Protótipo acadêmico, sem validação clínica.</div>
    </div>
    <nav>
      <button :class="{on: tab === 'internacao'}" @click="tab = 'internacao'">Internação e reabilitação</button>
      <button :class="{on: tab === 'cirurgia'}" @click="tab = 'cirurgia'">Centro cirúrgico</button>
      <button :class="{on: tab === 'alertas'}" @click="tab = 'alertas'">Alertas ({{ openAlerts }} {{ openAlerts === 1 ? 'aberto' : 'abertos' }})</button>
    </nav>
  </header>

  <div class="chips" v-if="status">
    <span class="chip" v-for="item in statusItems" :key="item.name">{{ item.active ? '✓' : '○' }} {{ item.name }}: {{ item.active ? 'ativo' : 'não ligado' }}</span>
  </div>
  <p class="error" v-if="loadError">{{ loadError }}</p>

  <!-- INTERNAÇÃO -->
  <template v-if="tab === 'internacao'">
    <div class="card row">
      <div>
        <label for="stay">Internação (MIMIC-IV Demo)</label>
        <select id="stay" v-model.number="stayId" @change="loadTimeline" :disabled="running" style="max-width: 100%">
          <option v-for="item in stays" :key="item.stay_id" :value="item.stay_id">{{ item.stay_id }}: {{ item.horas }} h, {{ item.eventos_sinais_vitais }} sinais, {{ item.eventos_prescricao }} prescrições{{ item.stay_id === suggested ? ' (sugerida)' : '' }}</option>
        </select>
      </div>
      <div>
        <label for="speed">Velocidade</label>
        <select id="speed" v-model.number="speed" :disabled="running">
          <option :value="0.6">1 hora a cada 0,6 s</option>
          <option :value="0.25">1 hora a cada 0,25 s</option>
          <option :value="0.08">1 hora a cada 0,08 s</option>
        </select>
      </div>
      <button class="primary" v-if="!running" @click="startMonitor" :disabled="!stayId">Iniciar monitoramento</button>
      <button v-else @click="stopMonitor">Parar</button>
      <span class="small muted" v-if="running">Hora {{ hours.length }}</span>
    </div>

    <div class="card banner" :class="risk ? risk.nivel : ''" v-if="risk">
      <div class="level">{{ levelIcon(risk.nivel) }} Risco {{ levelName(risk.nivel) }}: {{ pointsLabel(risk.pontuacao) }}</div>
      <ul class="plain" v-if="risk.motivos.length">
        <li v-for="(reason, index) in risk.motivos" :key="index">+{{ reason.pontos }} · {{ sourceName(reason.fonte) }}: {{ reason.descricao }}</li>
      </ul>
      <p class="small muted" v-else>Nenhum sinal ativo neste momento.</p>
      <p class="small muted" style="margin: 6px 0 0">{{ risk.observacao }}</p>
    </div>

    <div class="main-grid">
      <div class="card">
        <h2>Sinais vitais, hora a hora</h2>
        <p class="small muted">Os pontos marcam desvios sustentados em relação às 24 horas anteriores do próprio paciente. Falhas na linha são períodos de mais de 6 horas sem medição.</p>
        <div class="chart-box" v-for="vital in vitals" :key="vital.key">
          <div class="chart-head"><span>{{ vital.name }} ({{ vital.unit }})</span><strong>{{ lastValue(vital.key) }}</strong></div>
          <div class="chart-wrap"><canvas :id="'chart-' + vital.key" :aria-label="vital.name" role="img"></canvas></div>
        </div>
        <details>
          <summary>Ver as últimas 24 horas em tabela</summary>
          <div class="table-scroll">
            <table>
              <thead><tr><th>Hora</th><th v-for="vital in vitals" :key="vital.key">{{ vital.short }}</th></tr></thead>
              <tbody>
                <tr v-for="row in lastRows" :key="row.index"><td>{{ row.index }}</td><td v-for="vital in vitals" :key="vital.key">{{ row.values[vital.key] === null || row.values[vital.key] === undefined ? '–' : num(row.values[vital.key]) }}</td></tr>
              </tbody>
            </table>
          </div>
        </details>
      </div>
      <div class="card">
        <h2>Eventos</h2>
        <div class="feed">
          <ul class="plain">
            <li v-for="(event, index) in eventsNewestFirst" :key="index">
              <span class="tag">{{ eventType(event) }}</span> · Hora {{ hourIndex(event.inicio) }}<br />{{ event.descricao }}
            </li>
          </ul>
          <p class="small muted" v-if="!eventsNewestFirst.length">Nenhum evento até aqui.</p>
        </div>
      </div>
    </div>

    <div class="two">
      <div class="card">
        <h2>Marcha</h2>
        <p class="small muted">Compara a caminhada com a referência de 14 adultos saudáveis usando andador.</p>
        <div class="row" style="margin-bottom: 8px">
          <button @click="gaitExample('normal')" :disabled="gaitBusy">Exemplo normal</button>
          <button @click="gaitExample('alterada')" :disabled="gaitBusy">Exemplo com tronco 20° à frente (simulado)</button>
        </div>
        <label for="gait-file">Ou envie um CSV de esqueleto ou um vídeo da caminhada</label>
        <input id="gait-file" class="file" type="file" accept=".csv,.mp4,.avi,.mov,.mkv" @change="gaitUpload" :disabled="gaitBusy" />
        <p class="small" v-if="gaitBusy" style="margin-top: 8px">Analisando...</p>
        <p class="error" v-if="gaitError">{{ gaitError }}</p>
        <div v-if="gait" style="margin-top: 10px">
          <p class="small muted">{{ gait.fonte_dados }}<span v-if="gait.arquivo"> · {{ gait.arquivo }}</span></p>
          <template v-if="gait.avaliada">
            <p><strong>{{ gait.alerta ? '⚠ Fora da referência' : '✓ Dentro da referência' }}</strong>: nota {{ num(gait.pontuacao) }}, limiar {{ num(gait.limiar) }}, {{ gait.janelas }} janelas.</p>
            <p class="small">Maior desvio: {{ gait.medida_mais_distante.descricao }}. Valor {{ num(gait.medida_mais_distante.valor) }}; referência {{ num(gait.medida_mais_distante.referencia) }}.</p>
          </template>
          <p class="small" v-else>Não avaliada: {{ gait.motivo }}</p>
          <p class="small muted" v-if="gait.aviso">{{ gait.aviso }}</p>
        </div>
      </div>

      <div class="card">
        <h2>Voz e fala</h2>
        <p class="small muted">Sem as chaves do Azure, nada é transcrito. Nenhum texto é inventado.</p>
        <label for="voice-base">1. Gravação da pessoa em repouso, .wav (opcional, recomendada)</label>
        <input id="voice-base" class="file" type="file" accept=".wav" @change="voiceBase = $event.target.files[0] || null" :disabled="voiceBusy" />
        <label for="voice-file" style="margin-top: 10px">2. Áudio da consulta, .wav. A análise começa ao escolher este arquivo</label>
        <input id="voice-file" class="file" type="file" accept=".wav" @change="voiceUpload" :disabled="voiceBusy" />
        <p class="small" v-if="voiceBusy" style="margin-top: 8px">Analisando...</p>
        <p class="error" v-if="voiceError">{{ voiceError }}</p>
        <div v-if="voice" style="margin-top: 10px" class="small">
          <p>{{ voice.acustica.arquivo }}: {{ voice.acustica.duracao_s }} s.</p>
          <template v-if="voice.sinal_vocal.avaliado">
            <p><strong>{{ voice.sinal_vocal.presente ? '⚠' : '✓' }} {{ voice.sinal_vocal.descricao }}:</strong> {{ num(voice.sinal_vocal.pontuacao) }}, limiar {{ num(voice.sinal_vocal.limiar) }}, em {{ voice.sinal_vocal.frases }} trechos de fala.</p>
            <p class="muted">{{ voice.sinal_vocal.aviso }}</p>
          </template>
          <p v-else><strong>Sinal vocal:</strong> {{ voice.sinal_vocal.motivo }}</p>
          <p><strong>Transcrição:</strong> {{ voice.transcricao || 'indisponível' }}</p>
          <p><strong>Análise do texto:</strong> {{ voice.descricao }}</p>
        </div>
      </div>
    </div>

    <div class="card" v-if="report">
      <h2>Laudo</h2>
      <p class="small">{{ report }}</p>
    </div>
  </template>

  <!-- CIRURGIA -->
  <template v-if="tab === 'cirurgia'">
    <div class="card" v-if="surgeryInfo">
      <h2>Analisar uma cirurgia</h2>
      <p class="small muted">Avalia a Visão Crítica de Segurança em vídeo gravado de colecistectomia laparoscópica, um frame a cada 5 segundos. Nenhuma imagem é salva ou exibida.</p>
      <p class="error" v-if="!surgeryInfo.modelos_ativos">Os modelos treinados não estão em backend/models, então a análise está desligada.</p>
      <template v-else>
        <div class="row" v-if="surgeryInfo.videos_base.length" style="margin-bottom: 12px">
          <div>
            <label for="surgery-video">Vídeo do teste do Endoscapes2023 (base local)</label>
            <select id="surgery-video" v-model.number="surgeryVideo" :disabled="surgeryBusy">
              <option v-for="video in surgeryInfo.videos_base" :key="video" :value="video">Vídeo {{ video }}</option>
            </select>
          </div>
          <button class="primary" @click="surgeryDataset" :disabled="surgeryBusy">Analisar</button>
        </div>
        <p class="small muted" v-else>A base local não foi encontrada. Ainda é possível enviar um vídeo.</p>
        <div class="row">
          <div>
            <label for="surgery-clip">Segundo do primeiro clipe (opcional, se o vídeo continuar depois dele)</label>
            <input id="surgery-clip" class="number" type="number" min="1" step="1" v-model="surgeryClip" :disabled="surgeryBusy" />
          </div>
          <div>
            <label for="surgery-file">Ou envie um vídeo</label>
            <input id="surgery-file" class="file" type="file" accept=".mp4,.avi,.mov,.mkv" @change="surgeryUpload" :disabled="surgeryBusy" />
          </div>
        </div>
        <p class="small" v-if="surgeryBusy" style="margin-top: 8px">Analisando...</p>
        <p class="error" v-if="surgeryError">{{ surgeryError }}</p>
      </template>
    </div>

    <template v-if="surgery">
      <div class="card banner" :class="surgeryLevel">
        <div class="level">{{ surgeryHeadline }}</div>
        <p class="small" v-if="!surgery.resultado.avaliada">{{ surgery.resultado.motivo }}</p>
        <p class="small" v-if="surgery.resultado.especialistas">Marcação dos especialistas neste vídeo: {{ surgery.resultado.especialistas.cvs_atingido ? 'Visão Crítica atingida' : 'desvio, Visão Crítica não atingida' }}. O modelo {{ surgeryAgrees ? 'concordou' : 'discordou' }}.</p>
        <p class="small muted" v-if="surgery.alerta" style="margin: 6px 0 0">Alerta registrado na aba Alertas.</p>
      </div>

      <div class="main-grid" v-if="surgery.resultado.avaliada">
        <div class="card">
          <h2>Pontuação dos critérios ao longo do vídeo</h2>
          <p class="small muted">Média de 3 frames. O alerta olha o maior valor de cada critério. A pontuação não é uma probabilidade, e pode ser alta antes de o critério ser atingido.</p>
          <div class="chart-box" v-for="name in surgeryCharts" :key="name">
            <div class="chart-head"><span>{{ name }} · limiar {{ num(surgeryCriterion(name).limiar) }} (linha tracejada)</span><strong>pico {{ num(surgeryCriterion(name).pico) }}</strong></div>
            <div class="chart-wrap"><canvas :id="'surgery-chart-' + name" :aria-label="'Pontuação de ' + name" role="img"></canvas></div>
          </div>
          <details>
            <summary>Ver em tabela</summary>
            <div class="table-scroll">
              <table>
                <thead><tr><th>Segundo</th><th v-for="name in surgeryCharts" :key="name">{{ name }}</th></tr></thead>
                <tbody><tr v-for="(second, index) in surgery.resultado.tempo_s" :key="second"><td>{{ second }}</td><td v-for="name in surgeryCharts" :key="name">{{ num(surgery.resultado.series[name][index]) }}</td></tr></tbody>
              </table>
            </div>
          </details>
        </div>
        <div>
          <div class="card">
            <h2>Critérios</h2>
            <ul class="plain">
              <li v-for="item in surgery.resultado.criterios" :key="item.criterio">
                <template v-if="item.usado">{{ item.atingido ? '✓ Atingiu o limiar' : '⚠ Abaixo do limiar' }}</template>
                <template v-else>○ Não usado na decisão</template>
                <br /><strong>{{ item.criterio }}</strong>: {{ item.nome }}
              </li>
            </ul>
          </div>
          <div class="card">
            <h2>Estruturas detectadas</h2>
            <p class="small muted">Frames em que cada estrutura apareceu, de {{ surgery.resultado.frames_analisados }}. Não detectar uma estrutura não prova que ela está ausente.</p>
            <table>
              <tbody><tr v-for="item in surgery.resultado.estruturas" :key="item.classe"><td>{{ item.nome }}<span class="muted" v-if="!item.confiavel"> (menos confiável)</span></td><td>{{ item.frames }}</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>Laudo</h2>
        <p class="small">{{ surgery.laudo }}</p>
      </div>
    </template>

    <div class="card" v-if="surgeryInfo">
      <h2>Quanto confiar neste alerta</h2>
      <p class="small">Em {{ surgeryInfo.desempenho.videos }} vídeos de teste, o alerta pegou {{ surgeryInfo.desempenho.desvios_detectados.acertos }} de {{ surgeryInfo.desempenho.desvios_detectados.total }} desvios e não disparou em {{ surgeryInfo.desempenho.cvs_reconhecido.acertos }} de {{ surgeryInfo.desempenho.cvs_reconhecido.total }} cirurgias com a Visão Crítica atingida. AUROC {{ num(surgeryInfo.desempenho.AUROC) }}, com margem de {{ num(surgeryInfo.desempenho.AUROC_IC95[0]) }} a {{ num(surgeryInfo.desempenho.AUROC_IC95[1]) }}.</p>
      <p class="small muted">O C1 não entra na decisão, então um desvio só em C1 passa sem aviso. Base de um único centro, sem validação clínica. Apoio à decisão; não substitui a avaliação da equipe.</p>
    </div>
  </template>

  <!-- ALERTAS -->
  <template v-if="tab === 'alertas'">
    <div class="card">
      <h2>Histórico de alertas</h2>
      <label for="responsible">Seu nome, para registrar a confirmação</label>
      <input id="responsible" type="text" v-model="responsible" maxlength="80" />
      <p class="error" v-if="alertError">{{ alertError }}</p>
      <p class="small muted" style="margin-top: 8px">As datas do MIMIC-IV são deslocadas pela própria base para proteger os pacientes.</p>
    </div>
    <div class="card banner" :class="alert.nivel" v-for="alert in alerts" :key="alert.id">
      <div class="level">{{ levelIcon(alert.nivel) }} {{ alert.paciente }}: risco {{ levelName(alert.nivel) }}, {{ pointsLabel(alert.pontuacao) }}</div>
      <p class="small muted">{{ formatDate(alert.ocorrido_em) }} · origem: {{ sourceName(alert.origem) }}</p>
      <ul class="plain"><li v-for="(reason, index) in alert.motivos" :key="index">+{{ reason.pontos }} · {{ reason.descricao }}</li></ul>
      <p class="small" v-if="alert.confirmado_por" style="margin-top: 8px">✓ Confirmado por {{ alert.confirmado_por }} em {{ formatDate(alert.confirmado_em) }}.</p>
      <button v-else style="margin-top: 8px" @click="confirmAlert(alert)" :disabled="responsible.trim().length < 2">Confirmar que vi</button>
    </div>
    <p class="small muted" v-if="!alerts.length">Nenhum alerta ainda. Inicie o monitoramento de uma internação.</p>
  </template>
</div>

<script>
const VITALS = [
  { key: 'HR', name: 'Frequência cardíaca', short: 'FC', unit: 'bpm' },
  { key: 'RR', name: 'Frequência respiratória', short: 'FR', unit: 'irpm' },
  { key: 'SPO2', name: 'Oxigenação', short: 'SpO₂', unit: '%' },
  { key: 'SBP', name: 'Pressão sistólica', short: 'PAS', unit: 'mmHg' },
  { key: 'TEMP', name: 'Temperatura', short: 'Temp', unit: '°C' },
];
const charts = {};
const surgeryChartObjects = {};
let monitorSource = null;

function cssColor(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

async function api(url, options) {
  const response = await fetch(url, options);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) {
    throw new Error(typeof body.detail === 'string' ? body.detail : 'O servidor não conseguiu concluir o pedido.');
  }
  return body;
}

Vue.createApp({
  data() {
    return {
      tab: 'internacao', status: null, loadError: '', stays: [], suggested: null, stayId: null, speed: 0.25,
      running: false, vitals: VITALS, hours: [], series: {}, vitalEvents: [], rxEvents: [], risk: null, report: '',
      gait: null, gaitBusy: false, gaitError: '', voice: null, voiceBase: null, voiceBusy: false, voiceError: '',
      surgery: null, surgeryInfo: null, surgeryVideo: null, surgeryClip: '', surgeryBusy: false, surgeryError: '',
      alerts: [], responsible: '', alertError: '',
    };
  },
  computed: {
    openAlerts() { return this.alerts.filter((alert) => !alert.confirmado_por).length; },
    statusItems() {
      const s = this.status;
      return [
        { name: 'Sinais vitais e prescrições', active: s.sinais_vitais_prescricoes.ativo },
        { name: 'Marcha', active: s.marcha.ativo },
        { name: 'Sinal vocal', active: s.sinal_vocal.ativo },
        { name: 'Azure Speech', active: s.azure_speech.ativo },
        { name: 'Azure Language', active: s.azure_language.ativo },
        { name: 'Modelos de cirurgia', active: s.cirurgia.ativo },
      ];
    },
    eventsNewestFirst() {
      return [...this.vitalEvents, ...this.rxEvents].sort((a, b) => (a.inicio < b.inicio ? 1 : -1));
    },
    lastRows() {
      const first = Math.max(0, this.hours.length - 24);
      const rows = [];
      for (let i = this.hours.length - 1; i >= first; i -= 1) {
        const values = {};
        VITALS.forEach((vital) => { values[vital.key] = this.series[vital.key]?.[i]; });
        rows.push({ index: i + 1, values });
      }
      return rows;
    },
    surgeryCharts() { return Object.keys(this.surgery.resultado.series); },
    surgeryLevel() {
      const result = this.surgery.resultado;
      if (!result.avaliada) return '';
      return result.desvio ? 'atencao' : 'baixo';
    },
    surgeryHeadline() {
      const result = this.surgery.resultado;
      if (!result.avaliada) return '○ Não avaliada';
      return result.desvio ? '⚠ Indício de desvio: revisar o vídeo' : '✓ Sem indício de desvio nos critérios avaliados';
    },
    surgeryAgrees() {
      const result = this.surgery.resultado;
      return result.desvio === !result.especialistas.cvs_atingido;
    },
  },
  methods: {
    num(value, digits = 2) { return Number(value).toLocaleString('pt-BR', { maximumFractionDigits: digits }); },
    pointsLabel(points) { return points === 1 ? '1 ponto' : `${points} pontos`; },
    levelName(level) { return { baixo: 'baixo', atencao: 'de atenção', alto: 'alto' }[level]; },
    levelIcon(level) { return { baixo: '✓', atencao: '⚠', alto: '⛔' }[level]; },
    sourceName(source) {
      return { sinais_vitais: 'Sinais vitais', prescricao: 'Prescrição', marcha: 'Marcha', fala: 'Fala', voz: 'Voz', monitor: 'Monitoramento', cirurgia: 'Cirurgia' }[source] || source;
    },
    eventType(event) {
      if (event.tipo === 'sinal_vital') return 'Sinal vital';
      return event.gravidade === 'alta' ? 'Prescrição, gravidade alta' : 'Prescrição';
    },
    hourIndex(iso) {
      const start = this.hours[0];
      if (!start) return '–';
      return Math.round((new Date(iso) - new Date(start)) / 3600000) + 1;
    },
    formatDate(iso) { return iso ? iso.replace('T', ' ').slice(0, 16) : ''; },
    lastValue(key) {
      const values = this.series[key] || [];
      for (let i = values.length - 1; i >= 0; i -= 1) {
        if (values[i] !== null && values[i] !== undefined) {
          const unit = VITALS.find((vital) => vital.key === key).unit;
          return `${this.num(values[i])} ${unit}`;
        }
      }
      return '–';
    },
    buildCharts() {
      VITALS.forEach((vital) => {
        charts[vital.key]?.destroy();
        const canvas = document.getElementById(`chart-${vital.key}`);
        if (!canvas) return;
        charts[vital.key] = new Chart(canvas, {
          type: 'line',
          data: { labels: [], datasets: [{ data: [], borderColor: cssColor('--line'), borderWidth: 2, spanGaps: 6, tension: 0.15, pointRadius: [], pointBackgroundColor: cssColor('--critical'), pointBorderColor: cssColor('--surface'), pointBorderWidth: 2, pointHoverRadius: 4 }] },
          options: {
            animation: false, responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false }, tooltip: { displayColors: false, callbacks: { title: (items) => `Hora ${items[0].label}`, label: (item) => `${item.formattedValue} ${vital.unit}` } } },
            scales: {
              x: { grid: { display: false }, border: { color: cssColor('--axis') }, ticks: { color: cssColor('--muted'), maxTicksLimit: 8, maxRotation: 0, font: { size: 11 } } },
              y: { grid: { color: cssColor('--grid') }, border: { display: false }, ticks: { color: cssColor('--muted'), maxTicksLimit: 3, font: { size: 11 } } },
            },
          },
        });
      });
    },
    drawCharts() {
      VITALS.forEach((vital) => {
        const chart = charts[vital.key];
        if (!chart) return;
        const marks = new Set(this.vitalEvents.filter((event) => event.sinal === vital.key).map((event) => event.inicio));
        chart.data.labels = this.hours.map((_, index) => index + 1);
        // Cópia simples: o Chart.js não funciona com os arrays reativos do Vue.
        chart.data.datasets[0].data = [...(this.series[vital.key] || [])];
        // Sinais medidos poucas vezes, como a temperatura, precisam de um ponto para aparecer sem linha.
        chart.data.datasets[0].pointRadius = this.hours.map((hour) => (marks.has(hour) ? 5 : 1.5));
        chart.data.datasets[0].pointBackgroundColor = this.hours.map((hour) => cssColor(marks.has(hour) ? '--critical' : '--line'));
        chart.data.datasets[0].pointBorderWidth = this.hours.map((hour) => (marks.has(hour) ? 2 : 0));
        chart.update('none');
      });
    },
    showContext(payload) {
      this.risk = payload.risco;
      this.report = payload.laudo;
    },
    async loadTimeline() {
      this.loadError = '';
      this.stopMonitor();
      try {
        const data = await api(`/api/v1/pacientes/${this.stayId}/linha-do-tempo`);
        this.hours = data.horas;
        this.series = data.series;
        this.vitalEvents = data.eventos_sinais_vitais;
        this.rxEvents = data.eventos_prescricao;
        this.gait = data.marcha;
        this.voice = data.fala;
        this.showContext(data);
        await this.$nextTick();
        this.buildCharts();
        this.drawCharts();
      } catch (error) {
        this.loadError = error.message;
      }
    },
    startMonitor() {
      this.hours = [];
      this.series = Object.fromEntries(VITALS.map((vital) => [vital.key, []]));
      this.vitalEvents = [];
      this.rxEvents = [];
      this.risk = null;
      this.report = '';
      this.running = true;
      this.buildCharts();
      monitorSource = new EventSource(`/api/v1/pacientes/${this.stayId}/monitor?intervalo=${this.speed}`);
      monitorSource.onmessage = (message) => {
        const step = JSON.parse(message.data);
        this.hours.push(step.hora);
        VITALS.forEach((vital) => this.series[vital.key].push(step.valores[vital.key]));
        step.novos_eventos.forEach((event) => (event.tipo === 'sinal_vital' ? this.vitalEvents : this.rxEvents).push(event));
        this.risk = step.risco;
        this.drawCharts();
      };
      monitorSource.addEventListener('fim', () => this.finishMonitor());
      monitorSource.onerror = () => {
        this.loadError = 'A conexão com o monitoramento foi perdida.';
        this.stopMonitor();
      };
    },
    stopMonitor() {
      monitorSource?.close();
      monitorSource = null;
      this.running = false;
    },
    async finishMonitor() {
      this.stopMonitor();
      await this.loadTimeline();
    },
    afterAnalysis(field, result) {
      this[field] = result.resultado;
      this.showContext(result);
    },
    async gaitExample(name) {
      this.gaitBusy = true;
      this.gaitError = '';
      try {
        this.afterAnalysis('gait', await api(`/api/v1/pacientes/${this.stayId}/marcha/exemplo/${name}`, { method: 'POST' }));
      } catch (error) {
        this.gaitError = error.message;
      } finally {
        this.gaitBusy = false;
      }
    },
    async sendFile(event, url, field, busy, errorField, baseFile = null) {
      const file = event.target.files[0];
      if (!file) return;
      const form = new FormData();
      form.append('arquivo', file);
      if (baseFile) form.append('base', baseFile);
      this[busy] = true;
      this[errorField] = '';
      try {
        this.afterAnalysis(field, await api(url, { method: 'POST', body: form }));
      } catch (error) {
        this[errorField] = error.message;
      } finally {
        this[busy] = false;
        event.target.value = '';
      }
    },
    gaitUpload(event) { return this.sendFile(event, `/api/v1/pacientes/${this.stayId}/marcha`, 'gait', 'gaitBusy', 'gaitError'); },
    voiceUpload(event) { return this.sendFile(event, `/api/v1/pacientes/${this.stayId}/voz`, 'voice', 'voiceBusy', 'voiceError', this.voiceBase); },
    surgeryCriterion(name) { return this.surgery.resultado.criterios.find((item) => item.criterio === name); },
    async drawSurgeryCharts() {
      Object.values(surgeryChartObjects).forEach((chart) => chart.destroy());
      Object.keys(surgeryChartObjects).forEach((key) => delete surgeryChartObjects[key]);
      if (!this.surgery?.resultado.avaliada) return;
      await this.$nextTick();
      const result = this.surgery.resultado;
      this.surgeryCharts.forEach((name) => {
        const canvas = document.getElementById(`surgery-chart-${name}`);
        if (!canvas) return;
        const limit = this.surgeryCriterion(name).limiar;
        surgeryChartObjects[name] = new Chart(canvas, {
          type: 'line',
          data: {
            labels: [...result.tempo_s],
            datasets: [
              { label: 'Pontuação', data: [...result.series[name]], borderColor: cssColor('--line'), borderWidth: 2, tension: 0.15, pointRadius: 0, pointHoverRadius: 4 },
              { label: 'Limiar', data: result.tempo_s.map(() => limit), borderColor: cssColor('--muted'), borderWidth: 1, borderDash: [4, 4], pointRadius: 0, pointHoverRadius: 0 },
            ],
          },
          options: {
            animation: false, responsive: true, maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: { legend: { display: false }, tooltip: { displayColors: false, callbacks: { title: (items) => `${items[0].label} s` } } },
            scales: {
              x: { grid: { display: false }, border: { color: cssColor('--axis') }, ticks: { color: cssColor('--muted'), maxTicksLimit: 8, maxRotation: 0, font: { size: 11 } } },
              y: { min: 0, max: 1, grid: { color: cssColor('--grid') }, border: { display: false }, ticks: { color: cssColor('--muted'), maxTicksLimit: 3, font: { size: 11 } } },
            },
          },
        });
      });
    },
    async runSurgery(request) {
      this.surgeryBusy = true;
      this.surgeryError = '';
      try {
        this.surgery = await request();
        await this.drawSurgeryCharts();
      } catch (error) {
        this.surgeryError = error.message;
      } finally {
        this.surgeryBusy = false;
      }
    },
    surgeryDataset() {
      return this.runSurgery(() => api(`/api/v1/cirurgia/base/${this.surgeryVideo}`, { method: 'POST' }));
    },
    async surgeryUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const form = new FormData();
      form.append('arquivo', file);
      if (this.surgeryClip) form.append('fim_s', this.surgeryClip);
      await this.runSurgery(() => api('/api/v1/cirurgia/video', { method: 'POST', body: form }));
      event.target.value = '';
    },
    async confirmAlert(alert) {
      this.alertError = '';
      try {
        await api(`/api/v1/alertas/${alert.id}/confirmar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ responsavel: this.responsible }),
        });
      } catch (error) {
        this.alertError = error.message;
      }
    },
  },
  watch: {
    async tab(value) {
      if (value === 'internacao') {
        await this.$nextTick();
        this.buildCharts();
        this.drawCharts();
      } else if (value === 'cirurgia') {
        // A aba é recriada a cada visita, então os gráficos também precisam ser.
        await this.drawSurgeryCharts();
      }
    },
  },
  async mounted() {
    try {
      this.status = await api('/api/v1/status');
      this.surgeryInfo = await api('/api/v1/cirurgia');
      this.surgeryVideo = this.surgeryInfo.videos_base[0] ?? null;
      const patients = await api('/api/v1/pacientes');
      this.stays = patients.internacoes;
      this.suggested = patients.sugerida;
      this.stayId = patients.sugerida;
      await this.loadTimeline();
    } catch (error) {
      this.loadError = `Não foi possível falar com o servidor. ${error.message}`;
    }
    const alertSource = new EventSource('/api/v1/alertas/stream');
    alertSource.onmessage = (message) => { this.alerts = JSON.parse(message.data).alertas; };
  },
}).mount('#app');
</script>
</body>
</html>
